name: Update GitHub Trophies

on:
  schedule:
    - cron: '0 0 * * *' # Otomatis update setiap hari jam 00:00 UTC
  workflow_dispatch:    # Bisa dijalankan manual kapan saja

permissions:
  contents: write

jobs:
  update-trophy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Trophy SVG
        run: |
          curl -f -s "https://github-profile-trophy.vercel.app/?username=betawidesign007&theme=onedark&no-frame=false&no-bg=false&margin-w=4&rank=-?&column=8" -o trophy.svg || true
      - name: Commit SVG if valid
        run: |
          if [ -s trophy.svg ] && grep -q "<svg" trophy.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add trophy.svg
            git diff --quiet && git diff --staged --quiet || git commit -m "Update GitHub Trophies"
            git push
          fi
